stresses: "multi-module decomposition from prose; fixed top and uart_tx interfaces; cycle-exact 8N1 framing; FIFO full/back-to-back; reset mid-frame; parameterized bit period; trusted integration testbench"
pass_criteria:
  timing_met: true
