mode: build
top: aes128_core
spec: design_spec.json
tb: aes128_core_tb.v
generate_golden: true
iterations: 4
objective: minimize_luts
target_freq_mhz: 100.0
# An AES engine with 128-bit key, plaintext and ciphertext buses is an SoC block,
# not a chip top: its 390 port bits exceed the 106 user I/O of xc7a35tcpg236-1
# (chip_top_flow_for_soc_block).
implementation: out_of_context
# One synthesis of the baseline (about 20 S-box ROMs, 4 GB peak) passed 900 s
# twice (fixed_synthesis_timeout_blocks_heavy_designs).
synthesis_timeout_minutes: 45
# budgets apply to this entry in explorations and benches (entry_budgets_ignored_by_bench).
budgets:
  tool_minutes: 150
  wall_minutes: 240
stresses: "iterative AES-128 split into a sequencer, a combinational round and a combinational key-schedule step; 128-bit internal buses; S-box, ShiftRows, MixColumns and on-the-fly key expansion; one key-preparation edge plus ten round edges; FIPS-197 and AESAVS known answers plus back-to-back random blocks under backpressure"
pass_criteria:
  timing_met: true
