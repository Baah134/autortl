mode: build
top: rv32i_core
spec: design_spec.json
tb: rv32i_core_tb.v
generate_golden: true
iterations: 4
objective: minimize_luts
target_freq_mhz: 100.0
# A CPU core with a trace port is an SoC block, not a chip top: its 151 port bits
# exceed the 106 user I/O of xc7a35tcpg236-1 (chip_top_flow_for_soc_block).
implementation: out_of_context
# Each implementation of the CPU takes about 15 minutes, so the default 40-minute
# exploration budget ended explore-tier6-06 after two iterations
# (fixed_synthesis_timeout_blocks_heavy_designs).
synthesis_timeout_minutes: 30
explore_budgets:
  tool_minutes: 180
  wall_minutes: 300
stresses: "multi-cycle RV32I subset split into instruction memory, decoder, register file, ALU, data memory and sequencer; 26 internal connections; two combinational children; memories defined by reset; exact cycles per instruction class; branch, jump-and-link and word load/store semantics checked against an independent ISA model"
pass_criteria:
  timing_met: true
