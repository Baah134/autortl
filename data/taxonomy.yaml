# Error taxonomy — keyed on official Vivado message IDs.
# severity_override: ERROR promotes the message (we promote, we NEVER demote).
# Seeded from every error class hit during AutoRTL v1-v3 development.
messages:
  "VRFC 10-3609":
    meaning: "Compilation overwrote an earlier active module definition"
    repair: "Keep one active definition per module; never redeclare frozen companion modules"
    severity_override: ERROR
  "Synth 8-9873":
    meaning: "Synthesis overwrote an earlier active module definition"
    repair: "Keep one active definition per module; never redeclare frozen companion modules"
    severity_override: ERROR
  "Designutils 20-1307":
    meaning: "Unsupported Tcl control flow in an XDC file caused constraints to be skipped"
    repair: "Run conditional constraints as Tcl after synthesis, and retain the effective commands and timing reports"
    severity_override: ERROR
  "XSIM 43-4099":
    meaning: "A generated module omitted a timescale while another simulation module declared one"
    repair: "Give generated RTL a default 1ns/1ps timescale before verification; preserve explicit declarations"
    severity_override: null
  "VRFC 10-2063":
    meaning: "Elaboration found an instance of a module that is not defined in the compiled sources"
    repair: "If the missing module is a Xilinx primitive (CARRY4, LUT6, FDRE, DSP48E1, SRL16E, RAMB18E1 and the like), replace the instance with behavioral RTL that Vivado infers to that primitive; the verification flow simulates behavioral RTL without the UNISIM library. Otherwise define the module or fix the instance name"
    severity_override: null
  "XSIM 43-3322":
    meaning: "Static elaboration of the top design failed; the true cause is the preceding VRFC message"
    repair: "Repair the VRFC message reported before this one; this ID is only a wrapper"
    severity_override: null
  "VRFC 10-4982":
    meaning: "Verilog syntax error at the reported line"
    repair: "Fix the construct at that line in plain Verilog-2001 (the harness compiles .v files); a common cause is indexing or part-selecting a concatenation such as {d, c, b, a}[sel*8 +: 8], which needs a named wire first; SystemVerilog-only syntax is another"
    severity_override: null
  "VRFC 10-8530":
    meaning: "A module was ignored because of earlier compile errors in it"
    repair: "Repair the earlier VRFC error in that module; this ID only reports the consequence"
    severity_override: null
  "Common 17-53":
    meaning: "Harness queried design objects before opening a design during constraint-file generation"
    repair: "For No open design errors, fix Tcl execution order; preserve get_ports literally when writing XDC and do not mutate RTL"
    severity_override: null
  "Synth 8-327":
    meaning: "Inferred latch — a combinational always block leaves a signal unassigned in some branch"
    repair: "Add default assignments for every output at the top of the always @(*) block, or complete every if with an else"
    severity_override: ERROR
  "Synth 8-3352":
    meaning: "Multi-driven net — two blocks assign the same signal"
    repair: "Assign each signal from exactly one always block or one assign statement"
    severity_override: ERROR
  "Synth 8-6859":
    meaning: "Port width mismatch in instantiation"
    repair: "Regenerate the port connections exactly from the contract's port table; widths must match bit-for-bit"
    severity_override: null
  "Synth 8-693":
    meaning: "Unconnected port on instance"
    repair: "Connect every port in the contract; tie unused inputs to a defined constant"
    severity_override: null
  "Synth 8-7080":
    meaning: "Parallel synthesis license info (benign)"
    repair: "Ignore — informational only"
    severity_override: null
  "XSIM 43-3225":
    meaning: "Elaboration failed — usually a port/interface mismatch between DUT and testbench"
    repair: "Match the module interface (name, port list, widths) exactly to the contract; do not add or rename ports"
    severity_override: null
  "XSIM 43-4100":
    meaning: "Module not found during elaboration"
    repair: "The module name in the code must equal the contract name exactly (case sensitive)"
    severity_override: null
  "Timing 38-282":
    meaning: "No clock constraint reached some paths"
    repair: "Ensure the top-level clock port is named clk (contract law) so the auto-generated XDC applies"
    severity_override: null
  "Common 17-55":
    meaning: "Command called with bad arguments — often a path problem"
    repair: "Infra-class failure — verify forward-slash absolute paths; do not modify the design"
    severity_override: null
  "Vivado 12-4473":
    meaning: "Simulation step failed; see the referenced log for the true cause"
    repair: "Read compile.log/elaborate.log message IDs and repair those; this ID is only a wrapper"
    severity_override: null

# Methodology violations (report_methodology, UG1292 IDs). ADVISORY ONLY:
# these never kill candidates; they are digested into the planner's context.
harness_failures:
  stale_companion_masks_inlined_candidate:
    meaning: "An optimized top inlined a frozen companion it no longer instantiates, while the trusted testbench still instantiated that companion directly, so the stale companion file kept that part of the testbench passing without testing the candidate"
    repair: "Before compiling, require every frozen companion the trusted testbench instantiates to stay reachable from the candidate top; otherwise reject it as a design failure with that reason inside the bounded repair loop, and name those companions in the candidate context"
  checkpoint_replace_denied:
    meaning: "On Windows, another process holding a checkpoint file open made the atomic replace fail with WinError 5, and the run crashed with a traceback"
    repair: "Treat it as infrastructure: retry the replace with bounded backoff, never mutate design state, and never watch live run files with tools that hold them open; resume recovers from the journal"
  golden_budget_long_period_examples:
    meaning: "A specification example longer than a few thousand cycles exhausted the golden worker's instruction budget, so a long-period serial design could not express full-frame anchors"
    repair: "Keep examples under the budget, about 2,000 cycles for a per-cycle UART model; check full frames at real timing with an independent qualified --tb"
  backend_configuration_rough_edges:
    meaning: "Found while documenting the new backends (Oct 29): model IDs with '/' were rejected; llm/endpoints.local.yaml sat inside the hashed llm/ folder, so editing it made resume refuse; the built-in openai backend's server and default model were not in the cohort; spec-repair feedback was cut to 1,800 characters; doctor required Codex even when another backend was configured; a malformed endpoints file raised after every bench entry had run; --jobs 0 crashed with a traceback"
    repair: "Allow '/' in model aliases; default the endpoints file to the repository root, outside the harness identity; record the built-in openai server and model digest in the cohort; raise the feedback cap; make Codex optional in doctor when another backend is configured; guard endpoint loading in the runner; validate --jobs in argparse"
  model_cli_binary_moved_by_update:
    meaning: "The Codex desktop app replaced its versioned binary folder when it updated, so AUTORTL_CODEX_BIN pointed at a deleted file and every model call failed with 'worker could not launch' after a 13-minute test receipt (contract-campaign-23)"
    repair: "Run run.py doctor before every gate so a missing model CLI fails in seconds; re-point AUTORTL_CODEX_BIN after an app update"
  candidate_rtl_evades_simulation_gate:
    meaning: "Nothing restricted system tasks, preprocessor directives, synthesis pragmas, hierarchical references, force/release or escaped identifiers in model-written RTL, so a candidate could print TEST PASSED itself, show simulation and synthesis different designs (`ifdef SYNTHESIS, translate_off), read the testbench's expected values, write files at model-chosen paths ($fopen), or hide a changed interface behind a decoy module header (whole-harness review, Oct 29; none of 466 archived model-produced RTL files used any of these)"
    repair: "Reject, before any tool runs, model-written RTL containing system tasks, compiler directives other than `timescale, translate/pragma/synthesis comments, hierarchical identifiers, force/release or escaped identifiers"
  triage_misreads_license_info_as_infra:
    meaning: "Failure triage matched 'license' anywhere, and every Vivado synthesis log contains INFO [Common 17-349] Got license, so every synthesis failure, design or not, was classified as infrastructure: never repaired, retried, and able to end a run infra_blocked; model-controlled text could also steer the verdict (whole-harness review, Oct 29)"
    repair: "Match infrastructure signatures only on ERROR or CRITICAL WARNING lines and tool metadata, never INFO lines or ordinary output; a tool-ID design error on an ERROR line takes precedence"
  ladder_infra_blocked_missing_failure_kind:
    meaning: "The optimize loop's infra_blocked returns carried no failure_kind, so those runs entered the curriculum history as failed entries (whole-harness review, Oct 29)"
    repair: "Tag every infra_blocked and model_blocked outcome with failure_kind infra, and treat those statuses as infrastructure in the bench"
  model_text_overflows_supervisor_parser:
    meaning: "Deeply nested or very long model-written expressions made ast.parse in the supervisor raise MemoryError or RecursionError, outside every handled exception type, crashing the run in a way every resume replays (whole-harness review, Oct 29)"
    repair: "Convert MemoryError and RecursionError from parsing model text into the ordinary validation error, and bound expression size before parsing"
  doctor_surgery_skips_companion_gate:
    meaning: "Timing-doctor surgery and baseline repairs were verified without the stale-companion check, so a rewrite that inlines a frozen companion could be graded against the stale companion file (whole-harness review, Oct 29)"
    repair: "Apply the companion check to every model-written candidate path, including doctor surgery and repairs"
  latency_annotation_deletion_skips_check:
    meaning: "The latency check compared the candidate's @latency annotation only when one was present, so deleting the annotation skipped it for contracts with a known latency (whole-harness review, Oct 29)"
    repair: "When the contract's latency is known, require the candidate to declare exactly that latency"
  golden_sandbox_allocation_and_timeout_gaps:
    meaning: "The golden sandbox did not charge copy() or slicing to its allocation cap and has no OS memory limit on Windows; decorators on nested functions were unchecked; and a golden timeout was fed back to the model as an oracle rejection, spending a repair attempt and replaying differently on resume (whole-harness review, Oct 29)"
    repair: "Charge copies and slices to the allocation cap, reject decorators everywhere, and raise a distinct timeout that the harness treats as infrastructure"
  generator_selects_from_concatenation:
    meaning: "An optimization candidate part-selected a concatenation directly ({d, c, b, a}[sel * 8 +: 8]), which Verilog-2001 does not allow; xvlog failed (VRFC 10-4982) with no taxonomy hint and a repair call was spent (contract-campaign-20 mux4)"
    repair: "Tell the generator the harness compiles plain Verilog-2001 and to name a concatenation in a wire before selecting from it; give VRFC 10-4982 and 10-8530 repair hints"
  spec_prompt_omits_example_budget:
    meaning: "The planner's spec prompt never stated the golden sandbox's per-example budget, so a prose request for a long-period design (tier3 uart_fifo_build: UART at DIV=868, a 8,680-cycle frame) invites full-frame examples the oracle cannot run (predicted by an offline pre-flight of tier2/tier3, not yet observed)"
    repair: "State the limit in the spec prompt (after_cycles at or below 2000) and tell the planner to check an early part of long-period behavior in examples, leaving full frames to the generated and independent testbenches"
  fence_tag_drops_generated_modules:
    meaning: "A model fenced its Verilog with a tag other than lowercase verilog/systemverilog/sv (Verilog, v, SystemVerilog), so extraction fell back to the first module...endmodule span and silently dropped every later module of a multi-module answer"
    repair: "Match fence tags case-insensitively and accept v; then accept any fenced block that starts a module before falling back to raw spans; never return a partial multi-module answer as if complete"
  golden_fence_tag_keeps_prose:
    meaning: "A golden-model answer fenced as py, Python or python3 was not recognized, so the whole response, prose included, was validated as Python and failed, costing a repair call"
    repair: "Accept py/python/python3 fence tags case-insensitively, then any fenced block defining init and step, before using the raw response"
  evaluator_verdict_format_rejects_verified_gain:
    meaning: "An evaluator wrote its verdict as 'Recommendation: ACCEPT', '**Recommendation:** ACCEPT' or '**ACCEPT**' instead of the heading-newline form; the parser read REJECT, so a deterministically verified improvement was discarded"
    repair: "Read the first verdict token after a Recommendation heading or label, ignoring emphasis and punctuation; keep the count-consistency and unresolved-criterion vetoes unchanged"
  spec_lint_failure_skips_planner_repair:
    meaning: "In build mode from a prose request, the planner named the top after its only module, which the prompt never forbade; structural lint rejected the spec and the run ended at once with spec_lint_failed, with no feedback round (tier1-campaign-01 debouncer_build)"
    repair: "State the structural rules (top_name differs from every module name, binding rules) in the spec prompt; give a planner-written spec its lint or load errors back for at most max_fix_attempts repairs; a supplied JSON spec stays law and fails at once"
  unpinned_model_identity:
    meaning: "Runs called the Codex CLI default model without naming it, and the CLI does not report the model, so a change of the desktop default would silently change the model inside one cohort"
    repair: "Let a run name its model (RunConfig.model, run.py --model); route every role through it, save it in config.json, and record it as the requested model identity in the bench cohort"
  seed_without_timescale_costs_model_repair:
    meaning: "An optimize-mode seed without a timescale, verified with a testbench that declares one, failed elaboration with XSIM 43-4099; the harness spent a generator repair call and relied on the model to change nothing but the directive (tier1-campaign-01 pwm)"
    repair: "Give the verified baseline copy the same default 1ns/1ps timescale generated RTL receives, mechanically, when it has none; never spend a model call or let a model edit the frozen baseline for it"
  concurrent_bench_drops_history:
    meaning: "run_tier reads the curriculum history when a campaign starts and rewrites the whole file when it ends, so a second bench finishing in between had its record silently overwritten (found by reading the runner while planning parallel work)"
    repair: "Keep the history bytes read at the start; under a short exclusive lock, rewrite only if they are unchanged; otherwise fail closed as infrastructure (exit 3) with the record kept in the campaign's summary.json"
  io_dominated_timing_metric:
    meaning: "With I/O buffers and zero external delay, every harness-flow critical path of the six winners ends at an OBUF (101-107.5 MHz) while their logic closes at 181.8-425.5 MHz out of context, so candidate timing comparisons mostly measured pad delay (fmax-characterization-01; the 31-LUT counter: WNS +0.126 ns, worst register-to-register path +1.460 ns)"
    repair: "Keep acceptance on the full I/O-constrained WNS/WHS; also report register-to-register setup slack from the same routed design (guarded, since report_timing errors with no registers, Vivado 12-4739) as an advisory metric shown to the planner and evaluator"
  evaluator_verdict_conflict_or_blank_line:
    meaning: "The tolerant verdict parser took the first Recommendation line even when a later one disagreed (ACCEPT then REJECT read as ACCEPT), and no longer allowed a blank line between the heading and the verdict (read as REJECT) (independent review, Oct 29)"
    repair: "Collect every Recommendation verdict line, allowing blank lines after a heading; ACCEPT only when exactly one verdict is named across all of them; deterministic vetoes unchanged"
  parallel_build_winner_digest_lost:
    meaning: "With bench --jobs > 1 each entry runs in its own process, so the Orchestrator's build-mode rewrite of cfg.top_module never reached the parent and the winner digest was looked up under the wrong top name (None for debouncer_build) (independent review, Oct 29)"
    repair: "Resolve the winner from the run summary's top_module, falling back to the configured top"
  token_save_lock_misattributed:
    meaning: "Charging a call's tokens saved budget.json inside the model call's retry block, so a checkpoint lock after a successful, charged response discarded it and surfaced as model_blocked instead of a resumable checkpoint lock (independent review, Oct 29)"
    repair: "Charge tokens after the backend call has succeeded, outside the retry handling, so CheckpointLockedError propagates unchanged"
  infra_outcomes_missing_failure_kind:
    meaning: "Stub elaboration blocked by infrastructure, an integration compile that failed for infrastructure, and a checkpoint lock escaping a run carried no failure_kind infra, so they still entered the curriculum history as failed entries (independent review, Oct 29)"
    repair: "Tag build_blocked and integration failures with their failure kind, and map an escaped CheckpointLockedError to failure_kind infra in the bench"
  generator_instantiates_unsimulated_primitive:
    meaning: "An optimization candidate hand-instantiated a Xilinx CARRY4 primitive; the harness simulates behavioral RTL without the UNISIM library, so elaboration failed (VRFC 10-2063) with no taxonomy hint and a repair call was spent (tier1-campaign-02 pwm, iteration 5)"
    repair: "Tell the generator and timing doctor to infer device primitives from behavioral RTL rather than instantiate them, and give VRFC 10-2063 and its XSIM 43-3322 wrapper taxonomy entries so a repair names the cause"
  infra_blocked_entry_enters_history:
    meaning: "A bench entry that ended infrastructure-blocked (failure_kind infra) was recorded as a failed entry, so a host problem entered the curriculum history, lowered the pass rate and reset the streak (tier1-campaign-02 debouncer_build: the laptop entered Modern Standby, Reason Lid, 11:26-14:21, and the integration xelab/xvlog timed out)"
    repair: "A campaign with any infrastructure-blocked entry gets no verdict: keep its record in the campaign summary.json, write nothing to the history, exit 3; resume or rerun it on a host that stays awake"
  host_standby_stalls_tools:
    meaning: "Windows Modern Standby (lid close or idle timeout) throttles or freezes running Vivado and simulator processes; their wall time keeps counting, so tools time out and cleanup (taskkill) can itself time out"
    repair: "Operational: keep the host awake and plugged in for gates; treat the resulting timeouts as infrastructure, which the harness already does; check the System log (Kernel-Power 506/507) before suspecting the design or the harness"
  completed_child_dependency_omission:
    meaning: "DONE retained a verification manifest but omitted child RTL referenced by its recorded input hashes"
    repair: "Validate retained verification dependencies against their recorded hashes before publishing DONE; retain source and testbench identities and reject missing or changed dependencies"
  infeasible_incumbent_blocks_recovery:
    meaning: "A smaller timing-invalid incumbent or candidate outranks a timing-closed design"
    repair: "Require verified timing feasibility before objective comparison; record timing recovery separately from area or power gain"
  missing_editable_hierarchy_boundary:
    meaning: "An optimizer redeclared frozen companion RTL because generation and repair omitted dependency evidence"
    repair: "Provide the editable top and immutable companion identities to generation, repair and timing surgery; keep duplicate-module rejection"
  compile_failure_skips_bounded_repair:
    meaning: "A deterministic candidate compile failure bypasses the existing bounded design repair loop"
    repair: "Apply the configured repair bound consistently to compile and simulation failures; recheck static, interface, compile and simulation after repair; never repair infrastructure failures"
  missing_qualification_replay_proof:
    meaning: "Stage replay omitted raw assertion text or completed-run identity omitted qualification reports"
    repair: "Snapshot and restore raw simulation proof; hash qualification reports and raw proof in DONE evidence"
  implicit_windows_module_encoding:
    meaning: "Implicit Windows encoding can reject or corrupt non-ASCII RTL/testbench comments"
    repair: "Read and write RTL, trusted testbenches and generated module evidence consistently with explicit UTF-8, including evaluation and Doctor reuse"
  unobservable_first_qualification_mutation:
    meaning: "A generated payload grader can miss the first capacity/readiness fault despite detecting data faults"
    repair: "Retain missed faults and try a bounded observable fault portfolio without changing the testbench; require raw assertion proof"
  build_infrastructure_cause_erasure:
    meaning: "Exhausted module tool failures became generic module_failed summaries"
    repair: "Preserve tool failure kind, diagnostic, stage and testbench in build_blocked outcomes without RTL repair or rejection history"
  payload_only_capacity_blindness:
    meaning: "Accepted-transaction payload checks can pass a design with incorrect capacity/readiness"
    repair: "Combine generated oracle checks with independently qualified temporal/capacity tests, including child repair and integrated candidate gates"
  scoreboard_serial_drain_budget:
    meaning: "One-time latency allowance prematurely ends valid serial streaming transactions"
    repair: "Budget the declared latency for each transaction, plus bounded backpressure/drain allowance"
  golden_reset_step_budget:
    meaning: "Maximum data stimulus count leaves no room for mandatory reset initialization"
    repair: "Validate the combined data/reset step count before allocating random stimulus"
  scoreboard_early_output:
    meaning: "A combinational bypass passed scoreboard verification despite a nonzero declared minimum transfer latency"
    repair: "Track each accepted transaction cycle and reject outputs before its contract latency; keep legal simultaneous queued transfers"
  unanchored_or_unbounded_golden_examples:
    meaning: "Empty oracle anchors qualified vacuously or after_cycles allocated an unbounded supervisor list"
    repair: "Validate bounded concrete examples before oracle execution or generation; retain trusted-TB-only compatibility"
  golden_repair_without_feedback:
    meaning: "Invalid Python references escaped bounded repair or retries omitted the concrete failure"
    repair: "Retry invalid oracle source at most once with bounded diagnostic feedback; preserve provider and storage failures separately"
  watchdog_false_qualification:
    meaning: "A watchdog-only testbench failure was counted as detection of an injected behavioral defect"
    repair: "Require retained concrete assertion failure evidence; reject timeout, watchdog, missing and contradictory logs"
  golden_control_input_omission:
    meaning: "Generated oracle stimulus omitted reset/control inputs required by a correctly generated Python reference"
    repair: "Align reference inputs with actual reset initialization and comparison mode; qualify strict-key references through the real generated-build path"
  golden_temporal_contract_ambiguity:
    meaning: "A transaction oracle was instructed to model cycle scheduling already handled by the generated testbench"
    repair: "State fixed-latency and accepted-transaction oracle semantics explicitly; preserve independent RTL latency and handshake checks"
  malformed_evaluation_acceptance:
    meaning: "An incomplete or contradictory evaluator response was parsed as ACCEPT with zero failed criteria"
    repair: "Require a consistent nonempty summary and reject FAIL or INVESTIGATE criteria before promotion"
  baseline_testbench_coverage_gap:
    meaning: "Sparse counter tests accepted changed flag latency or incorrect high-bit comparisons"
    repair: "Check all outputs against an independent cycle reference across boundaries, controls and deterministic random stimulus"
  contract_context_starvation:
    meaning: "Contract roles invented tool settings, thresholds or grading requirements without run evidence"
    repair: "Supply immutable source, testbench, constraints and measured baseline context to every contract role"
  evaluation_evidence_gap:
    meaning: "An evaluator graded code or improvement without candidate RTL and previous-best metrics"
    repair: "Persist exact candidate evidence and previous-best metrics; reject contradictory ACCEPT with failed criteria"
  unsafe_spec_identifier:
    meaning: "A model-supplied identifier escaped source paths or top-level wiring used an invalid external binding"
    repair: "Validate ASCII Verilog names and all external bindings before creating files or Tcl"
  interrupted_persistence:
    meaning: "A process interruption partially wrote state or lost a durable checkpoint"
    repair: "Write sibling temporary files, flush, and atomically replace; checkpoint completed stages"
  resume_config_drift:
    meaning: "Resume reconstructed defaults or changed input, tool, objective or budget configuration"
    repair: "Load the saved configuration and verify frozen input hashes before continuing"
  duplicate_resume_evidence:
    meaning: "Resuming repeated accepted history or charged completed work twice"
    repair: "Use stable stage identifiers, immutable completed artifacts and idempotent history writes"
  stale_context_cache:
    meaning: "A cached metric belongs to different constraints, tools, dependencies or changed reports"
    repair: "Key exact source and complete execution context; verify retained report hashes before reuse"
  zero_budget_execution:
    meaning: "An exhausted or zero budget still spawned work"
    repair: "Check counters and remaining wall/tool time before every model and tool stage"
  rejected_contract_execution:
    meaning: "Negotiation exhausted its rounds and executed a contract the reviewer never accepted"
    repair: "Stop with contract_blocked after the final reviewed proposal; never execute an unreviewed refinement"
  unconstrained_boundary_timing:
    meaning: "Clock-only constraints left a registered I/O design without any timed data paths"
    repair: "Constrain boundary inputs and outputs against clk with explicit ideal zero-delay assumptions; retain missing-timing rejection"
  tb_latency_alignment:
    meaning: "Generated fixed-latency testbench sampled the wrong cycle or never drained its tail"
    repair: "Drive off-edge, use explicit latency convention, compare every sample and bound completion"
  tb_handshake_alignment:
    meaning: "A scoreboard sampled updated handshake signals or omitted data ports"
    repair: "Sample accepted transfers before sequential updates and compare all specified outputs"
  unsupported_verification_contract:
    meaning: "An unsupported protocol, reset or malformed contract silently received a testbench"
    repair: "Reject the contract with an explicit diagnostic before running a design"
  golden_execution_boundary:
    meaning: "Generated Python ran inside the supervisor or escaped its intended function interface"
    repair: "Validate restricted syntax and run pure golden functions in a bounded child with minimal environment"
  rtl_interface_misparse:
    meaning: "Parameterized, signed, grouped or non-ANSI ports were parsed with wrong names or widths"
    repair: "Parse module interface and safe parameter expressions; compare exact typed ports"
  static_comb_false_positive:
    meaning: "Substring structural checks or default-first assignments falsely rejected valid RTL"
    repair: "Use token-aware block checks and assignment coverage"
  incomplete_build_ladder:
    meaning: "Build called a missing generation step or promoted a top without integration verification"
    repair: "Implement bounded generate/repair/qualify and verify integrated top before measurement"
  infrastructure_round_accounting:
    meaning: "Infrastructure-only candidate rounds were counted as design rejections or stalls"
    repair: "Retain candidate stage evidence and stop or retry without changing design history"
  unheld_curriculum_promotion:
    meaning: "One aggregate passing run was treated as a held tier or incorrect candidates were accepted"
    repair: "Enforce three matching consecutive qualifying runs and mandatory individual gates"
  doctor_trial_artifact_mismatch:
    meaning: "An unaccepted Timing Doctor trial overwrote source or reports for a verified candidate"
    repair: "Isolate trials and adopt source, validated metrics and evidence path together"
  doctor_invalid_metrics:
    meaning: "Successful doctor tool exit was accepted despite invalid parsed metrics"
    repair: "Run shared metrics gate and retain verified original on failure"
  cached_metrics_invalid:
    meaning: "A cache hit bypassed metric integrity checks"
    repair: "Validate cached schema and metrics; recompute when invalid"
  stage_budget_overrun:
    meaning: "A stage timeout exceeded remaining run budget or reset for each simulation subprocess"
    repair: "Cap stages to remaining budgets and enforce one simulation deadline across compile, elaboration and execution"
  tool_launch_failure:
    meaning: "Tool executable is missing or the operating system rejects process creation"
    repair: "Report unavailable infrastructure with the launch error; never repair RTL for a launch failure"
  vivado_timeout_cleanup:
    meaning: "A timed-out Windows tool launcher left descendant jobs alive or discarded partial diagnostics"
    repair: "Terminate the owned process tree, preserve partial stdout/stderr, and report infrastructure timeout without RTL repair"
  missing_timing_metrics:
    meaning: "Default sentinel or nonfinite setup/hold slack was accepted as implementation evidence"
    repair: "Reject absent or nonfinite setup and hold metrics before scoring"
  codex_worker_unavailable:
    meaning: "Codex executable, authentication, or launch is unavailable"
    repair: "Surface infrastructure failure; restore Codex access without editing RTL or falling back to external providers"
  codex_worker_timeout:
    meaning: "Codex worker exceeded its bounded wall time"
    repair: "Terminate the worker, retain diagnostic evidence, and apply bounded infrastructure retry"
  codex_worker_protocol:
    meaning: "Codex returned malformed events, an incomplete/failed turn, or no final response"
    repair: "Reject the response as infrastructure failure; never accept partial RTL"
  model_call_budget_exhausted:
    meaning: "No model-call budget remains"
    repair: "Stop before spawning a worker; checkpoint and report budget exhaustion"
  baseline_verification_missing:
    meaning: "Missing baseline testbench leaves correctness unverified"
    repair: "Block before tool or model calls; require a real testbench"
  baseline_infrastructure_failure:
    meaning: "Baseline simulation or synthesis failed for an infrastructure or unknown reason"
    repair: "Block without RTL repair, design-rejection history, or best promotion"
  baseline_invalid:
    meaning: "A failing baseline or invalid baseline metrics were promoted as best"
    repair: "Only record a baseline winner after all mandatory verification and metric gates pass"
  restart_artifact_mismatch:
    meaning: "A restart replaced winning RTL while keeping the old winning metrics"
    repair: "Keep generation seed separate from immutable winning source and metrics"
  timing_summary_column_mismatch:
    meaning: "Combined Vivado timing tables were parsed with setup slack substituted for hold slack"
    repair: "Map summary header columns to values; require both setup and hold slack to be nonnegative"
  counter_testbench_clock_and_x_errors:
    meaning: "Counter testbench counted an extra enabled edge and treated unknown check conditions as nonfailures"
    repair: "Disable counting before settling flags, drive reset away from the sampling edge, and reject any check condition other than definite one"
  skipped_verification_rungs:
    meaning: "A candidate with incomplete compile or simulation checks reached synthesis and received verified metrics"
    repair: "Require simulation rung 4 before synthesis or metrics cache access; never repair RTL for unknown or infrastructure failures"
  ambiguous_simulation_verdict:
    meaning: "Termination alone or a pass marker mixed with errors is not verified success"
    repair: "Require an explicit standalone TEST PASSED verdict and reject failure diagnostics first"
  invalid_mutation_qualification:
    meaning: "Missing mutation, compile failure, infrastructure failure, or timeout does not prove that a testbench detects a bug"
    repair: "Require a passing control and an explicit testbench failure from the simulated mutant; requalify regenerated testbenches"


  provider_diagnostic_loss:
    meaning: "A model worker exit discarded actionable error evidence"
    repair: "Retain bounded redacted error events and stderr diagnostics; classify auth, quota, network and protocol failures"
  model_failure_checkpoint:
    meaning: "A provider failure escaped without a resumable explicit outcome"
    repair: "Checkpoint model_blocked without design rejection, preserve completed stages and charge all attempts"
  report_evidence_omission:
    meaning: "Role context omitted timing or utilization report identities even though files existed"
    repair: "Supply bounded previews plus complete-file hashes and explicit parsed metric provenance"
  illegal_latency_transformation:
    meaning: "Optimization advice proposed extra observable cycles or changed contract behavior"
    repair: "Preserve exact latency, throughput, reset, ports and parameters through every mutation and doctor action"
  hold_only_diagnosis:
    meaning: "Setup slack was nonnegative but a hold violation was diagnosed as timing closure"
    repair: "Use canonical setup/hold parsing; prefer physical hold repair without RTL delays or clock relaxation"
  missing_timing_diagnostic:
    meaning: "Timing diagnosis lacked complete setup or hold evidence"
    repair: "Replan for retained report and constraint inspection; never infer closure from missing metrics"

  unsupported_execution_option:
    meaning: "An execution control was accepted but silently ignored"
    repair: "Reject unsupported enabled settings explicitly and remove unreachable cache branches"

  contradictory_injected_guidance:
    meaning: "Active skill instructions contradicted immutable latency, reset or parameter contracts"
    repair: "Align actual injected references and test assembled role prompts, not only template fragments"
  missing_role_conventions:
    meaning: "Some role calls omitted mandatory system conventions or requested a missing skill"
    repair: "Use one system-prompt helper, provide selected skills, and test every role call"
  cyclic_fifo_reference:
    meaning: "A referenced async FIFO full flag depended combinationally on its gated next pointer"
    repair: "Compare current registered write-gray pointer and qualify capacity/data behavior with independent dual-clock tests"
  contract_negotiation_overhead:
    meaning: "Repeated model contract reviews blocked a task over wording of fixed harness checks"
    repair: "Render optimization contracts mechanically from immutable evidence and keep verification gates unchanged"

  tool_exit_evidence_omission:
    meaning: "Evaluator lacked actual subprocess exit records despite successful wrapper gates"
    repair: "Persist actual process and driver outcomes separately; validate receipts and retain their hashes through evaluation, cache and DONE"
  malformed_tool_exit_evidence:
    meaning: "Missing or invalid tool receipt history could conceal failed or unknown process outcomes"
    repair: "Expose evidence as unknown or invalid; never infer zero exits from log markers or select older successful attempts"

  locale_dependent_skill_decoding:
    meaning: "UTF8 guidance failed or changed meaning under Windows default text decoding"
    repair: "Read injected skill files with explicit UTF8 and test Unicode content independent of system locale"
  inferred_latency_ambiguity:
    meaning: "An absent source annotation was presented as a known zero-cycle behavioral contract"
    repair: "Mark absent annotations unknown, preserve observed source cycles, and require explicit numeric latency for typed builds"
  mixed_runtime_cohort:
    meaning: "A curriculum streak combined task-identical runs from different or unknown harness implementations"
    repair: "Bind cohort identity to frozen runtime and governance implementation; missing provenance cannot qualify a tier"

  windows_atomic_contention:
    meaning: "Windows denied an atomic checkpoint replacement while the old file remained intact"
    repair: "Retry only recognized Windows contention errors with bounded backoff; preserve the original target and error on exhaustion"
  structural_interface_drift:
    meaning: "Resolved default width concealed changed signedness, packed shape, public defaults or symbolic parameter dependencies"
    repair: "Preserve explicit signed port types and canonical inferred interface declarations; separate public parameters from internal constants"
  qualification_interface_drift:
    meaning: "A fallback qualification mutant dropped parameters or changed declared port shapes"
    repair: "Generate the mutant from the same typed interface stub and require real assertion detection"


  truncated_timing_path_context:
    meaning: "Timing report header previews ended before actual paths; FIFO planner could not identify its failing memory-to-output path"
    repair: "Expose a bounded excerpt from the original report with its path and full-file hash; keep setup/hold meaning faithful and preserve timing gates"
  omitted_doctor_trial_feedback:
    meaning: "A non-adopted physical trial remained on disk but its measured failure and implementation were absent from subsequent planning"
    repair: "Retain clearly labeled not-adopted trial facts in existing evaluation and planner advice; never substitute them for incumbent or candidate metrics"
  noop_doctor_surgery:
    meaning: "Doctor returned exact unchanged RTL and repeated simulation/implementation consumed the remaining FIFO03 budget"
    repair: "Skip only when source bytes and effective measured flow options are proven identical; record no-source-change and do not skip intentional physical changes"
  omitted_typed_build_semantics:
    meaning: "Integrated optimization context omitted resolved build behavior; planner invented an invalid-output requirement despite an explicit unspecified-payload qualifier"
    repair: "Carry complete bounded resolved typed specification evidence into existing fixed facts, preserving explicit qualifiers and all defined behavior; standalone optimization remains strict"

  invented_top_latency_requirement:
    meaning: "FIFO04 evaluator rejected a behaviorally and physically passing candidate for a numeric top annotation absent from the authoritative top contract"
    repair: "Require annotation only when the top declaration is known; retain typed latency through proven transparent wrappers and never infer aggregate latency for arbitrary module graphs"

  cross_module_latency_annotation:
    meaning: "Whole-file latency search attributed a helper child or block-comment example annotation to the selected unannotated top"
    repair: "Extract latency from the selected module and its attached header only; share scoped extraction at inference and deterministic validation gates"

  repeated_proposal_without_outcomes:
    meaning: "Packet and divider optimization repeated an earlier RTL proposal without compact prior instruction and standard-flow outcome context"
    repair: "Provide bounded completed prior proposal identities and outcomes; separate Doctor results and preserve intentional physical experiments"


  stale_plan_after_seed_change:
    meaning: "Accepted RTL changed the generation seed while the next iteration reused instructions planned for the old source"
    repair: "Supply actual editable RTL to planning, bind instructions to its exact source hash, and preserve the verified incumbent when fresh planning cannot fit the original budget"
  unsafe_normalized_candidate_dedup:
    meaning: "Regex comment stripping mapped distinct Verilog string-valued designs to one candidate hash and discarded a valid alternative"
    repair: "Eliminate only exact UTF8 source duplicates with full SHA256; normalized hashes remain advisory and never prove semantic equivalence"

  planner_budget_misreported_done:
    meaning: "Local planner budget handling converted an exhausted resumed execution into DONE instead of the established budget_exhausted outcome"
    repair: "Let execution budget exceptions reach the existing budget handler; retain the verified incumbent and distinguish a deliberate no-replan policy stop from a raised budget failure"

  mechanical_top_missing_timescale:
    meaning: "The mechanical build wrapper omitted a timescale and failed XSIM43-4099 when compiled before timescaled generated children"
    repair: "Emit the deterministic timescale before optional scoped latency metadata and verify top-first elaboration without spending model repair budget"

  invalid_golden_api_prompt:
    meaning: "The golden prompt showed an invalid Python return annotation and the model copied it into an oracle"
    repair: "Provide an executable unannotated API scaffold and regression-test it against the unchanged restricted interpreter"
  undocumented_golden_language_subset:
    meaning: "Oracle repair used f-strings accepted by general Python but rejected by the restricted execution policy"
    repair: "Expose current supported builtins and methods in the prompt, use literal port names, and preserve rejection of unsupported syntax"
  uncheckpointed_active_exit_walltime:
    meaning: "A clean failed run returned after a completed model call without persisting its final active wall time"
    repair: "Checkpoint active dispatch exits with the existing atomic save; preserve charge counts and keep completed reuse/input guards outside the checkpoint"

  signed_extrema_trace_gap:
    meaning: "Generated signed accepted-transaction inputs omitted a boundary sequence and missed a compiling 12-bit truncation fault in a 13-bit FIR result"
    repair: "Add a bounded signed minimum/maximum payload burst before the unchanged random tail; preserve oracle semantics, driver ownership, strict verdicts and reset-inclusive step limits"

  missing_invalid_payload_stimulus:
    meaning: "Continuously valid generated traffic missed a FIR fault that advances accepted-sample history on invalid input"
    repair: "Insert legal input bubbles with masked noise; preserve valid and payload when the prior rising edge sampled a blocked input"
  missing_sync_reset_pulse_stimulus:
    meaning: "Startup-only reset stimulus missed asynchronous history and validity changes under a synchronous-reset contract"
    repair: "Pulse reset wholly between sampling edges for synchronous contracts only; retain oracle and queue state and compare normal transfers after deassertion"

methodology:
  "TIMING-6":
    meaning: "No common primary clock between related clocks | timing between them is unsafe"
    advice: "Plan a CDC structure or declare the clock relationship; do not let paths cross unrelated clocks"
  "TIMING-9":
    meaning: "Unknown CDC circuitry | a crossing exists without a recognised synchroniser"
    advice: "Plan an explicit two-flop synchroniser or async FIFO module for the crossing"
  "TIMING-10":
    meaning: "Missing input or output delay constraint on a port"
    advice: "For benchmark runs this is acceptable; for board targets plan set_input_delay/set_output_delay values"
  "TIMING-18":
    meaning: "Missing input/output delay on clock-crossing IO"
    advice: "Same as TIMING-10; note it in the plan if the design will leave simulation"
  "SYNTH-6":
    meaning: "Timing-critical register has no direct reset connection pattern the tool likes"
    advice: "Plan synchronous resets on control state only; avoid resetting wide datapaths"
  "SYNTH-9":
    meaning: "Asynchronous reset planned where synchronous is preferred on 7-series"
    advice: "Prefer sync resets unless the contract demands async; 7-series FFs favour sync"
  "XDCC-1":
    meaning: "Clock constraint conflicts or overwrites another"
    advice: "One create_clock per physical clock; derived clocks via create_generated_clock"
  "LUTAR-1":
    meaning: "LUT on a clock or combinational clock path"
    advice: "Never gate or generate clocks in logic; plan clock enables instead"

  rtl_comment_literal_hides_forbidden_tasks:
    meaning: "Comment delimiters inside Verilog strings hid later forbidden tasks from safety scanning"
    repair: "Tokenize strings and comments in source order and regress forbidden-task, directive and pragma hiding"

  baseline_repair_skips_companion_check:
    meaning: "Baseline repair omitted the frozen-companion gate applied to normal and doctor candidates"
    repair: "Apply the same companion guard before any repaired-source flow and retain failure evidence"

  companion_instance_does_not_prove_top_behavior:
    meaning: "Textual instances in dead or disconnected logic do not establish that a separately tested companion implements the optimized top"
    repair: "Use a mechanically checked transparent-wrapper boundary when qualification depends on child-only behavior; otherwise require independent top behavior checks"

  tool_id_masks_host_failure:
    meaning: "Tool-ID precedence classified real permission failures and mixed host-failure logs as design bugs"
    repair: "Recognize decisive host failures across the log without treating routine informational license acquisition as infrastructure"

  board_simulation_outcome_not_proven:
    meaning: "Board-suite simulation ignored XSIM exit and counted elaboration or missing-verdict failures as killed behavioral faults"
    repair: "Require explicit process completion and assertion failure for fault detection; infrastructure and missing evidence never count"

  board_image_assumed_without_programming:
    meaning: "Hardware checking could label a requested bitstream as programmed without a programming receipt"
    repair: "Require a successful programming record matching the selected payload before reporting verified board image identity"

  golden_hardening_not_integrated:
    meaning: "Handoff and README described pending worker-branch code and tests as integrated into the frozen harness"
    repair: "Integrate the exact reviewed changes without reverting subsequent guards, then derive counts and gates from the actual combined source"
