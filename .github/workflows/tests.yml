# Runs every test that needs no Vivado, model login or board. Vivado,
# Codex and hardware behavior is mocked or replayed from recorded fixtures
# in these suites; live tool runs and board checks are archived under
# evidence/ instead, and the evidence job checks every digest recorded there.
name: tests

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Harness regression (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Allow long evidence paths
        run: git config --system core.longpaths true
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Harness tests
        run: python -m pytest tests/ -q -p no:cacheprovider

  evidence:
    name: Evidence audit (committed blobs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Source bindings are checked against every committed version, so the
      # audit needs the full history, not the default single-commit clone.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Every SHA-256 claim under evidence/
        run: python tools/evidence_audit.py --rev HEAD

  tooling:
    name: Mailbox, board-suite and audit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Allow long evidence paths
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      # Name the suite folder: the board scripts (echo_test.py, fir_test.py)
      # match pytest's *_test.py pattern but are hardware programs, not tests.
      - name: Mailbox, board-suite and audit tests
        run: python -m pytest coordination hardware/basys3/harness_winners/tests hardware/basys3/fmax/tests tools/tests -q -p no:cacheprovider
