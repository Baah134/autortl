# Runs every test that needs no Vivado, model login or board. Vivado,
# Codex and hardware behavior is mocked or replayed from recorded fixtures
# in these suites; live tool runs and board checks are archived under
# evidence/ instead.
name: tests

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Harness regression (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Allow long evidence paths
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Harness tests
        run: python -m pytest tests/ -q -p no:cacheprovider

  tooling:
    name: Mailbox and board-suite tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Allow long evidence paths
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      # Name the suite folder: the board scripts (echo_test.py, fir_test.py)
      # match pytest's *_test.py pattern but are hardware programs, not tests.
      - name: Mailbox and board-suite tests
        run: python -m pytest coordination hardware/basys3/harness_winners/tests -q -p no:cacheprovider
